name: stackchain_analyzer
description: >
  Flutter project health analyzer for the StackChain ecosystem.
  Detects architecture problems, code quality issues, performance
  anti-patterns, security risks, dependency issues, and release readiness.
version: 0.1.0
homepage: https://github.com/stackchain/stackchain_analyzer
repository: https://github.com/stackchain/stackchain_analyzer
issue_tracker: https://github.com/stackchain/stackchain_analyzer/issues
topics:
  - flutter
  - analyzer
  - cli
  - architecture
  - dx

environment:
  sdk: ^3.5.0

executables:
  stackchain_analyzer:
  stackchain:

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  yaml: ^3.1.2
  analyzer: ^7.3.0
  http: ^1.2.2
  meta: ^1.15.0
  collection: ^1.19.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.8
