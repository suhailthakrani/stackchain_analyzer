name: stackchain_analyzer
description: >-
  Flutter project health analyzer — architecture, performance, security,
  dependencies, release readiness, and code quality in one CLI.
version: 0.2.0
homepage: https://evenlogix.com
repository: https://github.com/suhailthakrani/stackchain_analyzer
issue_tracker: https://github.com/suhailthakrani/stackchain_analyzer/issues
documentation: https://github.com/suhailthakrani/stackchain_analyzer#readme
topics:
  - flutter
  - analyzer
  - cli
  - architecture
  - dx

environment:
  sdk: '>=3.0.0 <4.0.0'

executables:
  stackchain_analyzer:
  stackchain:

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  yaml: ^3.1.2
  # Lower bound supports Dart 3.8 (analyzer 8.1.x); upper bound allows latest on newer SDKs.
  analyzer: '>=8.1.1 <15.0.0'
  http: ^1.2.2
  meta: ^1.15.0
  collection: ^1.19.0

dev_dependencies:
  lints: '>=5.0.0 <7.0.0'
  test: ^1.25.8
